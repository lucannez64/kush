[workspace]
members = ["crates/kush", "crates/infer-proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The tests run the compiler (and Cranelift) many times: at opt-level 1 the
# suite takes half the time, while a rebuild after a compiler change costs
# the same. Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1
