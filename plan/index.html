<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kush plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d8d8d2;
    --done-bg: #dcefe2; --done-bd: #7fbf93;
    --np-bg: #e9f5ec; --np-bd: #7fbf93;
    --prog-bg: #fdf0c8; --prog-bd: #d9a520;
    --ready-bg: #e3ecfb; --ready-bd: #5b86d6;
    --wait-bg: #efefeb; --wait-bd: #c9c9c2;
    --edge: #a9c8b3; --edge-hot: #2f6fdc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1e; --panel: #232427; --ink: #e8e8e3; --muted: #9a9a94; --line: #3a3b3f;
      --done-bg: #1f3a29; --done-bd: #4f9a69; --np-bg: #1c2f23; --np-bd: #4f9a69;
      --prog-bg: #44391a; --prog-bd: #c9961c; --ready-bg: #1e2c47; --ready-bd: #5b86d6;
      --wait-bg: #2a2b2e; --wait-bd: #4a4b50; --edge: #4b6b56; --edge-hot: #6d9cf0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.35 system-ui, sans-serif; color: var(--ink); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  .stat b { display: block; font-size: 14px; } .stat span { color: var(--muted); font-size: 11px; }
  input { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; width: 200px; background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.on { background: var(--ready-bg); border-color: var(--ready-bd); }
  .legend { margin-top: 6px; display: flex; gap: 6px; }
  .pill { border: 1px solid; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  main { flex: 1; display: flex; min-height: 0; }
  #view { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #view.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  path { fill: none; stroke: var(--edge); stroke-width: 1.4; }
  path.hot { stroke: var(--edge-hot); stroke-width: 2.4; }
  path.dim, .node.dim { opacity: .22; }
  .node { position: absolute; width: 200px; border: 1px solid; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  .node .id { font: 600 12px ui-monospace, monospace; }
  .node .ord { font-size: 10px; color: var(--muted); margin-right: 5px; }
  .order-row { display: grid; grid-template-columns: 34px 14px 1fr; gap: 6px; padding: 3px 0; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 12px; }
  .order-row:hover { background: var(--bg); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid; margin-top: 3px; }
  .area { font-size: 10px; color: var(--muted); }
  .node .sz { font-size: 9px; color: var(--muted); margin-left: 4px; }
  .node .hard { font-size: 9px; color: #c0392b; margin-left: 4px; }
  .node .t { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.sel { box-shadow: 0 0 0 2px var(--edge-hot); }
  .k-completed { background: var(--done-bg); border-color: var(--done-bd); }
  .k-not-pushed { background: var(--np-bg); border-color: var(--np-bd); border-style: dashed; }
  .k-in-progress { background: var(--prog-bg); border-color: var(--prog-bd); }
  .k-ready { background: var(--ready-bg); border-color: var(--ready-bd); }
  .k-waiting { background: var(--wait-bg); border-color: var(--wait-bd); }
  aside { width: 360px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside section { padding: 12px 14px; overflow: auto; border-bottom: 1px solid var(--line); }
  #detail { flex: 1.2; } #runlog { flex: 1; }
  aside h2 { font-size: 14px; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .entry { display: grid; grid-template-columns: 62px 1fr; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .entry .who { font-weight: 600; }
  .deps a { cursor: pointer; text-decoration: underline; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">Kush plan</h1>
    <div class="stat"><b id="s-done">–</b><span>completed</span></div>
    <div class="stat"><b id="s-prog">–</b><span>in progress</span></div>
    <div class="stat"><b id="s-ready">–</b><span>ready</span></div>
    <div class="stat"><b id="s-wait">–</b><span>waiting</span></div>
    <div class="stat"><b id="s-np">–</b><span>not pushed</span></div>
    <input id="find" placeholder="Find a node">
    <button id="zin">+</button><button id="zout">−</button><button id="fit">Fit all</button>
    <button id="onlyprog">In progress</button><button id="direct" class="on">Direct edges</button><button id="ordbtn">Order</button>
    <div class="stat"><b id="s-load">–</b><span>load</span></div>
    <div class="stat"><b id="s-head">–</b><span>main / origin</span></div>
    <div class="stat"><b id="s-ahead">–</b><span>commits ahead</span></div>
    <div class="stat"><b id="s-wt">–</b><span>worktrees</span></div>
  </div>
  <div class="legend">
    <span class="pill k-completed">● completed</span>
    <span class="pill k-not-pushed">● completed, not pushed</span>
    <span class="pill k-in-progress">◐ in progress</span>
    <span class="pill k-ready">○ ready to start</span>
    <span class="pill k-waiting">○ waiting</span>
  </div>
</header>
<main>
  <div id="view"><div id="world"><svg id="edges"></svg></div></div>
  <aside>
    <section id="detail"><span class="muted">Select a node to see its details, dependencies and log.</span></section>
    <section id="runlog"><h2 id="lowtitle">Running log</h2><div id="log"></div></section>
  </aside>
</main>
<script>
const W = 200, H = 46, GX = 36, GY = 70;
let data = null, selected = null, onlyProgress = false, directOnly = true, showOrder = false;
let scale = 1, tx = 20, ty = 20, laidOut = false, pos = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kindClass = k => "k-" + k.replace(/ /g, "-").replace("not-pushed", "not-pushed");

function layout(nodes) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const layer = {};
  const depth = id => layer[id] ?? (layer[id] = byId[id].deps.length ? 1 + Math.max(...byId[id].deps.map(depth)) : 0);
  nodes.forEach(n => depth(n.id));
  const rows = [];
  nodes.forEach(n => (rows[layer[n.id]] ??= []).push(n.id));
  const x = {};
  rows.forEach(r => r.forEach((id, i) => x[id] = i));
  for (let pass = 0; pass < 6; pass++) {
    rows.forEach((r, li) => {
      if (li === 0) return;
      r.sort((a, b) => bary(a) - bary(b));
      r.forEach((id, i) => x[id] = i);
    });
  }
  function bary(id) { const d = byId[id].deps; return d.length ? d.reduce((s, p) => s + x[p], 0) / d.length : x[id]; }
  const width = Math.max(...rows.map(r => r.length));
  rows.forEach((r, li) => {
    const off = (width - r.length) * (W + GX) / 2;
    r.forEach((id, i) => pos[id] = { x: off + i * (W + GX), y: li * (H + GY) });
  });
}

function ancestors(id, acc = new Set()) { for (const d of data.byId[id].deps) if (!acc.has(d)) { acc.add(d); ancestors(d, acc); } return acc; }
function descendants(id, acc = new Set()) { for (const n of data.nodes) if (n.deps.includes(id) && !acc.has(n.id)) { acc.add(n.id); descendants(n.id, acc); } return acc; }

function render() {
  const world = $("world"), svg = $("edges");
  world.querySelectorAll(".node").forEach(e => e.remove());
  const q = $("find").value.trim().toLowerCase();
  let focus = null;
  if (selected) {
    focus = new Set([selected]);
    const up = ancestors(selected), down = descendants(selected);
    if (directOnly) { data.byId[selected].deps.forEach(d => focus.add(d)); data.nodes.filter(n => n.deps.includes(selected)).forEach(n => focus.add(n.id)); }
    else { up.forEach(a => focus.add(a)); down.forEach(a => focus.add(a)); }
  }
  let paths = "";
  for (const n of data.nodes) for (const d of n.deps) {
    const a = pos[d], b = pos[n.id];
    const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
    const hot = selected && (d === selected || n.id === selected || (!directOnly && focus.has(d) && focus.has(n.id)));
    const dim = (selected && !hot) || (onlyProgress && data.byId[n.id].kind !== "in progress" && data.byId[d].kind !== "in progress");
    paths += `<path class="${hot ? "hot" : dim ? "dim" : ""}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
  }
  svg.innerHTML = paths;
  for (const n of data.nodes) {
    const p = pos[n.id], el = document.createElement("div");
    const match = !q || n.id.toLowerCase().includes(q) || n.title.toLowerCase().includes(q);
    const dim = !match || (focus && !focus.has(n.id)) || (onlyProgress && n.kind !== "in progress");
    el.className = `node ${kindClass(n.kind)} ${dim ? "dim" : ""} ${n.id === selected ? "sel" : ""}`;
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.innerHTML = `<div><span class="ord">#${n.order}</span><span class="id">${esc(n.id)}</span><span class="sz">${esc(n.size)}</span>${n.hard ? '<span class="hard">hard</span>' : ""}</div><div class="t" title="${esc(n.title)}">${esc(n.title)}</div>`;
    el.onclick = ev => { ev.stopPropagation(); select(n.id === selected ? null : n.id); };
    world.appendChild(el);
  }
  applyTransform();
}

function select(id) { selected = id; render(); detail(); }

function detail() {
  const box = $("detail");
  if (!selected) { box.innerHTML = '<span class="muted">Select a node to see its details, dependencies and log.</span>'; return; }
  const n = data.byId[selected];
  const dependents = data.nodes.filter(m => m.deps.includes(n.id)).map(m => m.id);
  const link = ids => ids.length ? ids.map(i => `<a data-id="${esc(i)}">${esc(i)}</a>`).join("") : '<span class="muted">none</span>';
  const blocking = n.deps.filter(d => data.byId[d].status !== "done");
  box.innerHTML = `<h2>${esc(n.id)}</h2><div>${esc(n.title)}</div>
    <p><b>${esc(n.kind)}</b> · dependency position #${n.order} of ${data.total} · ${esc(n.area || "")} · size ${esc(n.size)}${n.hard ? " · hard" : ""}${n.commit ? " · commit <code>" + esc(n.commit) + "</code>" : ""}</p>
    ${n.desc ? `<p>${esc(n.desc)}</p>` : ""}
    <p class="deps"><span class="muted">depends on:</span> ${link(n.deps)}</p>
    ${blocking.length ? `<p class="deps"><span class="muted">blocked by:</span> ${link(blocking)}</p>` : ""}
    <p class="deps"><span class="muted">needed by:</span> ${link(dependents)}</p>
    ${(n.log || []).slice().reverse().map(e => `<div class="entry"><span class="muted">${esc((e.time || "").slice(11, 19))}</span><div><span class="who">${esc(e.who)}</span> ${esc(e.text)}</div></div>`).join("")}`;
  box.querySelectorAll("a[data-id]").forEach(a => a.onclick = () => select(a.dataset.id));
}

function stats() {
  const c = data.counts;
  $("title").textContent = data.title;
  $("s-done").textContent = `${c.completed + c["not pushed"]} / ${data.total}`;
  $("s-prog").textContent = c["in progress"]; $("s-ready").textContent = c.ready;
  $("s-wait").textContent = c.waiting; $("s-np").textContent = c["not pushed"];
  $("s-load").textContent = data.load.join(" ");
  $("s-head").textContent = `${data.repo.head || "?"} / ${data.repo.origin || "?"}`;
  $("s-ahead").textContent = data.repo.ahead + (data.repo.dirty ? " +dirty" : "");
  $("s-wt").textContent = data.repo.worktrees;
  if (showOrder) {
    $("lowtitle").textContent = "Dependency order — not execution priority";
    $("log").innerHTML = data.order.map(id => { const n = data.byId[id];
      return `<div class="order-row" data-id="${esc(id)}"><span class="muted">#${n.order}</span><span class="dot ${kindClass(n.kind)}"></span><div><b>${esc(id)}</b> ${esc(n.title)} <span class="area">${esc(n.area || "")} · ${esc(n.size)}</span></div></div>`; }).join("");
    $("log").querySelectorAll(".order-row").forEach(r => r.onclick = () => select(r.dataset.id));
    return;
  }
  $("lowtitle").textContent = "Running log";
  $("log").innerHTML = data.log.map(e => `<div class="entry"><span class="muted">${esc((e.time || "").slice(11, 19))}</span><div><span class="who">${esc(e.node)}</span> ${esc(e.text)}</div></div>`).join("") || '<span class="muted">No log entries yet. Use scripts/plan.py log ID "message".</span>';
}

async function refresh() {
  try {
    const next = await (await fetch("/api/state")).json();
    next.byId = Object.fromEntries(next.nodes.map(n => [n.id, n]));
    const shape = JSON.stringify(next.nodes.map(n => [n.id, n.deps]));
    if (!data || shape !== data.shape) { pos = {}; layout(next.nodes); }
    next.shape = shape; data = next;
    if (selected && !data.byId[selected]) selected = null;
    stats(); render(); detail();
    if (!laidOut) { laidOut = true; fit(); }
  } catch (e) { $("title").textContent = "Plan (server unreachable)"; }
}

function applyTransform() { $("world").style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit() {
  const xs = Object.values(pos), v = $("view").getBoundingClientRect();
  const w = Math.max(...xs.map(p => p.x)) + W, h = Math.max(...xs.map(p => p.y)) + H;
  scale = Math.min(v.width / (w + 40), v.height / (h + 40), 1.4);
  tx = (v.width - w * scale) / 2; ty = 20; applyTransform();
}
function zoom(f, cx, cy) {
  const v = $("view").getBoundingClientRect();
  cx ??= v.width / 2; cy ??= v.height / 2;
  tx = cx - (cx - tx) * f; ty = cy - (cy - ty) * f; scale *= f; applyTransform();
}
$("zin").onclick = () => zoom(1.2); $("zout").onclick = () => zoom(1 / 1.2); $("fit").onclick = fit;
$("onlyprog").onclick = e => { onlyProgress = !onlyProgress; e.target.classList.toggle("on", onlyProgress); render(); };
$("direct").onclick = e => { directOnly = !directOnly; e.target.classList.toggle("on", directOnly); render(); };
$("find").oninput = render;
$("ordbtn").onclick = e => { showOrder = !showOrder; e.target.classList.toggle("on", showOrder); stats(); };
$("view").onclick = () => select(null);
$("view").addEventListener("wheel", e => { e.preventDefault(); const r = $("view").getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let drag = null;
$("view").onmousedown = e => { drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false }; $("view").classList.add("drag"); };
window.onmousemove = e => { if (!drag) return; tx = drag.tx + e.clientX - drag.x; ty = drag.ty + e.clientY - drag.y; applyTransform(); };
window.onmouseup = () => { drag = null; $("view").classList.remove("drag"); };
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
