[adapter]
module = "otp_tui.adapter"
rust-output = "src/ffi.rs"
kush-output = "src/adapter.kush"

[[resource]]
name = "Store"
rust-type = "crate::bridge::Store"
release-symbol = "otp_store_release"

[[resource]]
name = "Terminal"
rust-type = "crate::bridge::Terminal"
release-symbol = "otp_terminal_release"

[[function]]
name = "store_new"
symbol = "otp_store_new"
rust-path = "crate::bridge::store_new"
parameters = []
result = { resource = "Store" }

[[function]]
name = "count"
symbol = "otp_count"
rust-path = "crate::bridge::count"
parameters = [{ name = "store", resource = "Store" }]
result = "i64"

[[function]]
name = "add"
symbol = "otp_add"
rust-path = "crate::bridge::add"
parameters = [{ name = "store", resource = "Store" }, { name = "uri", type = "bytes" }]
result = "i64"
fallible = true

[[function]]
name = "remove"
symbol = "otp_remove"
rust-path = "crate::bridge::remove"
parameters = [{ name = "store", resource = "Store" }, { name = "at", type = "i64" }]
result = "unit"
fallible = true

[[function]]
name = "label"
symbol = "otp_label"
rust-path = "crate::bridge::label"
parameters = [{ name = "store", resource = "Store" }, { name = "at", type = "i64" }]
result = "bytes"
fallible = true

[[function]]
name = "code"
symbol = "otp_code"
rust-path = "crate::bridge::code"
parameters = [{ name = "store", resource = "Store" }, { name = "at", type = "i64" }, { name = "timestamp", type = "i64" }]
result = "bytes"
fallible = true

[[function]]
name = "remaining"
symbol = "otp_remaining"
rust-path = "crate::bridge::remaining"
parameters = [{ name = "store", resource = "Store" }, { name = "at", type = "i64" }, { name = "timestamp", type = "i64" }]
