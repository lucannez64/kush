fallible = true

[[function]]
name = "advance"
symbol = "otp_advance"
rust-path = "crate::bridge::advance"
parameters = [{ name = "store", resource = "Store" }, { name = "at", type = "i64" }]
result = "unit"
fallible = true

[[function]]
name = "now"
symbol = "otp_now"
rust-path = "crate::bridge::now"
parameters = []
result = "i64"
fallible = true

[[function]]
name = "backspace"
